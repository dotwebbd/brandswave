[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_OFFICE_ADDRESS,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_FACEBOOK_URL,NEXT_PUBLIC_CONTACT_PHONE,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GOOGLE_MAPS_EMBED_URL"
